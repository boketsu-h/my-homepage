media:
  input: images/uploads
  output: /my-homepage/images/uploads

content:
  - name: posts
    label: ブログ
    type: collection
    path: _posts

    filename: "{year}-{month}-{day}-{primary}.md"

    view:
      primary: title
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: タイトル
        type: string
        required: true

      - name: date
        label: 投稿日
        type: date
        required: true

      - name: layout
        type: string
        hidden: true
        default: post

      - name: body
        label: 本文
        type: rich-text
