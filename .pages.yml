media:
  - name: blog_images
    label: ブログ画像
    input: images/uploads
    output: /my-homepage/images/uploads
    categories: [image]
    rename: safe

content:
  - name: posts
    label: ブログ
    type: collection
    path: _posts

    filename: "{year}-{month}-{day}-{primary}.md"

    view:
      primary: title
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: タイトル
        type: string
        required: true

      - name: date
        label: 投稿日
        type: date
        required: true

      - name: layout
        type: string
        hidden: true
        default: post

      - name: body
        label: 本文
        type: rich-text
        options:
          format: markdown
          media: blog_images
          rename: safe
          switcher: true
