---
layout: default
title: Blog
---

<main>

  <h1>BLOG</h1>

  <p>
    日記や趣味のことなど。
  </p>


  <!-- ===== 記事一覧 ===== -->

  <div class="blog-list">

    {% for post in site.posts %}

      <article class="blog-item">

        <p class="blog-date">
          {{ post.date | date: "%Y.%m.%d" }}
        </p>

        <h2>
          <a href="{{ post.url | relative_url }}">
            {{ post.title }}
          </a>
        </h2>

        <p>
          {{ post.excerpt | strip_html | truncate: 120 }}
        </p>

      </article>

    {% endfor %}

  </div>

</main>
