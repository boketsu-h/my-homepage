---
layout: default
title: Gallery
---

<main>

  <h1>GALLERY</h1>

  <p>描いたものなど。</p>

  <!-- 並び替え・絞り込み -->
  <div class="gallery-controls">

    <div class="gallery-sort">
      <label for="gallery-sort">並び順</label>

      <select id="gallery-sort">
        <option value="newest">新しい順</option>
        <option value="oldest">古い順</option>
      </select>
    </div>

    <div class="gallery-filters">

      <button type="button" class="active" data-filter="all">
        ALL
      </button>

      <button type="button" data-filter="オリジナル">
        オリジナル
      </button>

      <button type="button" data-filter="二次創作">
        二次創作
      </button>

      <button type="button" data-filter="featured">
        おすすめ
      </button>

    </div>

  </div>


  <!-- ギャラリー -->
  <div class="gallery" id="gallery">

    {% assign works = site.gallery | sort: "date" | reverse %}

    {% for work in works %}

      <article
        class="gallery-item"
        data-category="{{ work.category }}"
        data-featured="{% if work.featured %}1{% else %}0{% endif %}"
        data-date="{{ work.date | date: '%s' }}"
      >

        <div class="gallery-image-frame">
          <img
            src="{{ work.image }}"
            alt="{{ work.title | escape }}"
            loading="lazy"
            onclick="openLightbox(this.src, this.alt)"
          >
        </div>

        <h2>{{ work.title }}</h2>

        {% if work.description %}
          <p>{{ work.description }}</p>
        {% endif %}

      </article>

    {% endfor %}

  </div>

</main>


<!-- 画像拡大 -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <img id="lightbox-image" src="" alt="">
</div>


<script>

  const gallery = document.getElementById("gallery");
  const sortSelect = document.getElementById("gallery-sort");
  const filterButtons = document.querySelectorAll(".gallery-filters button");

  let currentFilter = "all";


  /* =========================
     ギャラリー更新
  ========================= */

  function updateGallery() {

    const items = Array.from(
      gallery.querySelectorAll(".gallery-item")
    );

    const sortType = sortSelect.value;


    /* ----- 並び替え ----- */

    items.sort((a, b) => {

      const dateA = Number(a.dataset.date);
      const dateB = Number(b.dataset.date);

      if (sortType === "newest") {
        return dateB - dateA;
      }

      if (sortType === "oldest") {
        return dateA - dateB;
      }

      return 0;

    });


    /* ----- 並び替えた順番で再配置 ----- */

    items.forEach(item => {
      gallery.appendChild(item);
    });


    /* ----- 絞り込み ----- */

    items.forEach(item => {

      const category = item.dataset.category;
      const featured = item.dataset.featured;

      let show = false;


      // すべて
      if (currentFilter === "all") {
        show = true;
      }


      // おすすめ作品
      else if (currentFilter === "featured") {
        show = featured === "1";
      }


      // オリジナル・二次創作
      else {
        show = category === currentFilter;
      }


      item.hidden = !show;

    });

  }


  /* =========================
     並び順変更
  ========================= */

  sortSelect.addEventListener("change", () => {
    updateGallery();
  });


  /* =========================
     絞り込みボタン
  ========================= */

  filterButtons.forEach(button => {

    button.addEventListener("click", () => {

      currentFilter = button.dataset.filter;

      filterButtons.forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      updateGallery();

    });

  });


  /* =========================
     最初の表示
  ========================= */

  updateGallery();


  /* =========================
     画像拡大
  ========================= */

  function openLightbox(src, alt) {

    const lightbox = document.getElementById("lightbox");
    const image = document.getElementById("lightbox-image");

    image.src = src;
    image.alt = alt;

    lightbox.style.display = "flex";

  }


  function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
  }

</script>
